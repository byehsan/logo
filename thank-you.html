<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you · byEhsan</title>
  <link rel="icon" type="image/svg+xml" href="base.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1d1f20; --surface: #262829; --text: #f2f2f3;
      --muted-t: #9a9ba0; --border: #3a3b3d;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .card {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      text-align: center; max-width: 420px;
    }
    .mark { color: var(--text); }
    .title { font-size: 32px; font-weight: 600; line-height: 1.1; }
    .msg { font-size: 14px; color: var(--muted-t); line-height: 1.6; }
    .cta {
      margin-top: 6px; display: inline-flex; align-items: center; gap: 8px;
      background: var(--text); color: var(--bg); text-decoration: none;
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 11px 22px; border-radius: 10px; transition: opacity 0.2s;
    }
    .cta:hover { opacity: 0.85; }
    footer { border-top: 1px solid var(--border); padding: 20px 0; text-align: center; font-size: 12px; opacity: 0.35; }

    @keyframes py-happy {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30%       { transform: translateY(-9px) rotate(-6deg); }
      55%       { transform: translateY(0) rotate(4deg); }
      75%       { transform: translateY(-3px) rotate(-2deg); }
    }
    .mark #mark {
      transform-box: view-box;
      transform-origin: 100px 58px;
      animation: py-happy 1.8s ease-in-out infinite;
    }
  </style>
</head>
<body>

<main>
  <div class="card">
    <svg class="mark" viewBox="0 0 200 220" width="72" height="79" fill="none" stroke="currentColor" stroke-linejoin="miter" stroke-miterlimit="10">
      <g id="mark">
        <path d="M100 20L172 58L100 96L28 58Z" stroke-width="2.6"/>
        <path d="M172 58L100 204" stroke-width="2.6"/>
        <path d="M28 58L100 204" stroke-width="2.6"/>
        <path d="M100 96L100 204" stroke-width="1.4" stroke-dasharray="4 4"/>
        <circle cx="100" cy="58" r="3.4" fill="currentColor" stroke="none"/>
      </g>
    </svg>
    <div class="title">Thank you</div>
    <p class="msg">Your message reached the workbench. Expect a reply within two business days.</p>
    <a class="cta" href="./">Back to byEhsan</a>
  </div>
</main>

<footer>byEhsan logo system · <a href="https://github.com/byehsan/logo" style="color:inherit">github.com/byehsan/logo</a></footer>

</body>
</html>
