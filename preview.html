      color: #f2f2f3;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      padding: 48px 32px;
      min-height: 100vh;

    .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .cell label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #f2f2f3; opacity: 0.55; }
    .cell svg, .cell img { display: block; }
    hr { border: none; border-top: 1px solid #f2f2f3; opacity: 0.1; margin: 48px 0; }

    .c-graphite { color: #2b2b2d; }
