<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <style>
    /* alert flicker — the crown facet and crown flash urgently, the rest stays dim */
    @keyframes py-flicker {
      0%, 44%  { opacity: 1; }
      45%, 89% { opacity: 0.15; }
      90%, 100% { opacity: 1; }
    }
    #p0    { animation: py-flicker 0.34s steps(1,end) infinite; }
    #crown { animation: py-flicker 0.34s steps(1,end) infinite; }
  </style>
  <g id="mark" fill="none" stroke="currentColor" stroke-linejoin="miter" stroke-miterlimit="10">
    <path id="p0" d="M100 20L172 58L100 96L28 58Z" stroke-width="4.4"/>
    <path id="p1" d="M172 58L100 204" stroke-width="2" opacity="0.25"/>
    <path id="p2" d="M28 58L100 204" stroke-width="2" opacity="0.25"/>
    <path id="p3" d="M100 96L100 204" stroke-dasharray="4 4" stroke-width="1.4" opacity="0.25"/>
    <circle id="crown" cx="100" cy="58" r="3.4" fill="currentColor" stroke="none"/>
  </g>
</svg>
