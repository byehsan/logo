<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <style>
    /* frustrated jitter */
    @keyframes py-jitter {
      0%, 100% { transform: translateX(-0.6px); }
      50%       { transform: translateX(0.6px); }
    }
    #mark { animation: py-jitter 0.4s steps(2,end) infinite; }
  </style>
  <g id="mark" fill="none" stroke="currentColor" stroke-linejoin="miter" stroke-miterlimit="10">
    <path id="p0" d="M100 20L172 58L100 96L28 58Z" stroke-width="2.6" stroke-dasharray="5 4"/>
    <path id="p1" d="M172 58L100 204" stroke-width="2.6" stroke-dasharray="5 4"/>
    <path id="p2" d="M28 58L100 204" stroke-width="2.6" stroke-dasharray="5 4"/>
    <path id="p3" d="M100 96L100 204" stroke-width="1.4" stroke-dasharray="3 3"/>
    <circle id="crown" cx="100" cy="58" r="3.4" fill="currentColor" stroke="none"/>
  </g>
</svg>
