<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <style>
    /* spring joy, settles */
    @keyframes py-snap {
      0%, 60% { transform: scale(1); }
      78%      { transform: scale(0.93); }
      100%     { transform: scale(1); }
    }
    #mark {
      transform-box: view-box;
      transform-origin: 100px 58px;
      animation: py-snap 2.2s cubic-bezier(.2,.9,.2,1) infinite;
    }
  </style>
  <g id="mark" fill="none" stroke="currentColor" stroke-linejoin="miter" stroke-miterlimit="10">
    <path id="p0" d="M100 20L172 58L100 96L28 58Z" stroke-width="3.2"/>
    <path id="p1" d="M172 58L100 204" stroke-width="3.2"/>
    <path id="p2" d="M28 58L100 204" stroke-width="3.2"/>
    <path id="p3" d="M100 96L100 204" stroke-width="1.6" stroke-dasharray="4 4"/>
    <circle id="crown" cx="100" cy="58" r="4.4" fill="currentColor" stroke="none"/>
  </g>
</svg>
