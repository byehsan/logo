<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&amp;display=swap');
    /* asleep, breathing */
    @keyframes py-breathe-503 {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }
    #mark { animation: py-breathe-503 2.2s ease-in-out infinite; }
    @keyframes py-zzz {
      0%   { opacity: 0;   transform: translate(0,0)       scale(0.7); }
      15%  { opacity: 1; }
      85%  { opacity: 0.8; }
      100% { opacity: 0;   transform: translate(26px,-26px) scale(1.1); }
    }
    #zzz {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 600;
      animation: py-zzz 2.2s ease-in-out infinite;
    }
  </style>
  <g id="mark" fill="none" stroke="currentColor" stroke-linejoin="miter" stroke-miterlimit="10">
    <path id="p0" d="M100 20L172 58L100 96L28 58Z" stroke-width="2.6"/>
    <path id="p1" d="M172 58L100 204" stroke-width="2.6"/>
    <path id="p2" d="M28 58L100 204" stroke-width="2.6"/>
    <path id="p3" d="M100 96L100 204" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle id="crown" cx="100" cy="58" r="3.4" fill="currentColor" stroke="none"/>
  </g>
  <text id="zzz" x="135" y="45" font-family="'Space Grotesk',system-ui,sans-serif" font-weight="600" font-size="26" fill="currentColor">Zzz</text>
</svg>
