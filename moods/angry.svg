<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <style>
    /* angry — crown narrows to a tight, shaking glare. The outline never moves or
       changes shape/color — the mood read comes from the crown alone. */
    @keyframes mood-angry {
      0%, 100% { transform: scale(0.6) translateX(0); }
      10%       { transform: scale(0.5) translateX(-6px); }
      20%       { transform: scale(0.5) translateX(6px); }
      30%       { transform: scale(0.5) translateX(-6px); }
      40%       { transform: scale(0.5) translateX(6px); }
      50%       { transform: scale(0.6) translateX(0); }
    }
    #crown {
      transform-box: view-box;
      transform-origin: 100px 58px;
      animation: mood-angry 1.1s ease-in-out infinite;
    }
  </style>
  <g id="mark" fill="none" stroke="currentColor" stroke-linejoin="miter" stroke-miterlimit="10">
    <path id="p0" d="M100 20L172 58L100 96L28 58Z" stroke-width="2.6"/>
    <path id="p1" d="M172 58L100 204" stroke-width="2.6"/>
    <path id="p2" d="M28 58L100 204" stroke-width="2.6"/>
    <path id="p3" d="M100 96L100 204" stroke-width="1.4" stroke-dasharray="4 4"/>
    <circle id="crown" cx="100" cy="58" r="3.4" fill="currentColor" stroke="none"/>
  </g>
</svg>
